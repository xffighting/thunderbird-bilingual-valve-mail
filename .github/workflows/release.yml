name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:ui
      - run: PYTHONPATH=native-host python3 native-host/translation_quality_regression.py
      - name: Build release archives
        run: |
          mkdir -p dist
          zip -X -q -r "dist/game-mail-summary-${GITHUB_REF_NAME}.xpi" \
            manifest.json src ui icons README.md docs
          git archive --format=zip \
            --output "dist/thunderbird-bilingual-valve-mail-${GITHUB_REF_NAME}-source.zip" \
            HEAD
          (cd dist && sha256sum \
            "game-mail-summary-${GITHUB_REF_NAME}.xpi" \
            "thunderbird-bilingual-valve-mail-${GITHUB_REF_NAME}-source.zip" \
            > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/game-mail-summary-${GITHUB_REF_NAME}.xpi" \
            "dist/thunderbird-bilingual-valve-mail-${GITHUB_REF_NAME}-source.zip" \
            "dist/SHA256SUMS" \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
